<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planos - Jobee</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }

    .checkout {
      margin-top: 40px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Escolha seu plano</h1>

<div class="container">

  <!-- PLANO BÁSICO -->
  <div class="card">
    <h2>Básico</h2>
    <p>Acesso parcial à dashboard</p>
    <div class="price">R$ 39,99</div>
    <button class="btn" onclick="selecionarPlano('Básico', 39.99)">Escolher</button>
  </div>

  <!-- PLANO MÉDIO -->
  <div class="card">
    <h2>Médio</h2>
    <p>Acesso total + dicas para o negócio</p>
    <div class="price">R$ 89,99</div>
    <button class="btn" onclick="selecionarPlano('Médio', 89.99)">Escolher</button>
  </div>

  <!-- PLANO PREMIUM -->
  <div class="card">
    <h2>Premium</h2>
    <p>Dashboard + dicas + IA assistente</p>
    <div class="price">R$ 119,99</div>
    <button class="btn" onclick="selecionarPlano('Premium', 119.99)">Escolher</button>
  </div>

</div>

<!-- CHECKOUT -->
<div class="checkout">
  <h2>Resumo da Assinatura</h2>

  <p><strong>Plano:</strong> <span id="plano">Nenhum</span></p>
  <p><strong>Valor:</strong> R$ <span id="valor">0.00</span></p>

  <h3>Tem um cupom?</h3>
  <input type="text" placeholder="Digite seu cupom" id="cupom">

  <br><br>
  <button class="btn">Finalizar Assinatura</button>
</div>

<script>
  function selecionarPlano(nome, preco) {
    document.getElementById('plano').innerText = nome;
    document.getElementById('valor').innerText = preco.toFixed(2);
  }
</script>

</body>
</html>
